<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بصيرة | الباك اند</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1B4F72;
      --teal: #148F77;
      --gold: #D4A017;
      --bg: #F4F7FB;
      --ink: #1A2332;
      --muted: #5A6A7A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", Tahoma, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 45% at 100% 0%, rgba(20,143,119,.12), transparent 55%),
        radial-gradient(ellipse 55% 40% at 0% 20%, rgba(27,79,114,.10), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      width: min(560px, 100%);
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 22px;
      padding: 2rem;
      box-shadow: 0 16px 40px rgba(27,79,114,.10);
    }
    h1 {
      margin: 0 0 .4rem;
      color: var(--navy);
      font-size: 2rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 1.4rem;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.7;
    }
    .links {
      display: grid;
      gap: .75rem;
    }
    a {
      display: block;
      text-decoration: none;
      font-weight: 800;
      padding: .9rem 1rem;
      border-radius: 14px;
      text-align: center;
      transition: transform .15s ease, filter .15s ease;
    }
    a:hover { transform: translateY(-1px); filter: brightness(1.03); }
    .primary {
      background: linear-gradient(115deg, var(--navy), var(--teal));
      color: #fff;
    }
    .secondary {
      background: #EEF3F8;
      color: var(--navy);
      border: 1px solid #E2E8F0;
    }
    .gold {
      background: var(--gold);
      color: var(--ink);
    }
    .hint {
      margin-top: 1.2rem;
      font-size: .92rem;
      color: var(--muted);
      font-weight: 600;
    }
    code {
      background: #EEF3F8;
      padding: .1rem .35rem;
      border-radius: 6px;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>بصيرة</h1>
    <p>خادم الباك اند يعمل بنجاح. اختر الوجهة:</p>
    <div class="links">
      <a class="primary" href="{{ admin_url }}">لوحة التحكم (Admin)</a>
      <a class="secondary" href="{{ api_url }}">فهرس واجهة API</a>
      <a class="gold" href="{{ front_hint }}" target="_blank" rel="noopener">موقع جمعية نبض (فرونت)</a>
    </div>
    <p class="hint">
      للتشغيل الكامل استخدم ملف <code>start.bat</code> من جذر المشروع.
    </p>
  </main>
</body>
</html>
