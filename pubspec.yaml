name: basera
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Speech & Audio
  speech_to_text: ^7.0.0
  flutter_tts: 3.8.3  # Compatible with SDK 34
  audioplayers: ^6.0.0
  audio_service: ^0.18.13
  record: ^5.0.0
  path_provider: ^2.1.2

  # Networking
  http: ^1.2.0
  dio: ^5.4.2+1

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  permission_handler: ^11.2.0
  connectivity_plus: ^5.0.2

  # File handling
  file_picker: ^8.1.2
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/basera_app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/basera_app_icon.png
  adaptive_icon_background: "#0F4C5C"
  adaptive_icon_foreground: assets/basera_app_icon.png
  remove_alpha_ios: true

# 🔴 هذا هو السطر المهم الذي يحل المشكلة نهائيًا
dependency_overrides:
  record_linux: ^1.0.0
